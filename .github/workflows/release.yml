name: Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build
        required: true
        type: string

concurrency:
  group: docker-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected a SemVer tag such as v2.13.1-1"
            exit 1
          fi
          version=${RELEASE_TAG#v}
          printf 'tag=%s\nversion=%s\nimage=ghcr.io/%s:%s\n' \
            "$RELEASE_TAG" "$version" "${GITHUB_REPOSITORY,,}" "$version" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Build image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.revision=$(git -C release-source rev-parse HEAD)" \
            --tag "$IMAGE" release-source

      - name: Start image with PostgreSQL
        env:
          NEXSPENCE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export NEXSPENCE_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          compose=(docker compose -p nexspence-smoke -f docker-compose.release.yml)
          trap '"${compose[@]}" down --volumes' EXIT

          if ! "${compose[@]}" up -d --wait --wait-timeout 180; then
            "${compose[@]}" logs --no-color --tail 80
            exit 1
          fi

          curl -fsS http://127.0.0.1:8081/ -o "$RUNNER_TEMP/nexspence-index.html"
          grep -Fq 'id="root"' "$RUNNER_TEMP/nexspence-index.html"
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/v2/)
          if [[ "$status" != 200 && "$status" != 401 ]]; then
            echo "::error::Unexpected OCI registry status: $status"
            exit 1
          fi

      - name: Publish image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package=${GITHUB_REPOSITORY#*/}
          endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/${package,,}/versions?per_page=100"
          errors="$RUNNER_TEMP/ghcr-versions-error"
          if ! tags=$(gh api --paginate "$endpoint" --jq '.[].metadata.container.tags[]?' 2>"$errors"); then
            if ! grep -Fq '(HTTP 404)' "$errors"; then
              cat "$errors" >&2
              exit 1
            fi
          fi
          if grep -Fxq "$VERSION" <<< "$tags"; then
            printf 'Image `%s` is already published.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --platform linux/amd64 "$IMAGE"
          printf 'Published `%s` after a successful startup check.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
